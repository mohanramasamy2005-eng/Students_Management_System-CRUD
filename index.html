<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="icon" href="./Student-png.webp">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="#0d0d0d"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="#0d0d0d"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="#0d0d0d"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="#0d0d0d"/></svg>
    </div>
    <div class="logo-text">STUDENT<span>_</span>DB</div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-primary" onclick="openAddModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Student
    </button>
  </div>
</div>

<div class="container">
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-icon green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4dff91" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <div class="stat-label">Total Students</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4da6ff" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      </div>
      <div>
        <div class="stat-label">Departments</div>
        <div class="stat-value" id="statDepts">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon yellow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffb84d" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div>
        <div class="stat-label">Avg CGPA</div>
        <div class="stat-value" id="statCgpa">—</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search by name, roll no, or email..." oninput="loadStudents()">
    </div>
    <select class="filter-select" id="deptFilter" onchange="loadStudents()">
      <option value="">All Departments</option>
      <option value="Computer Science">Computer Science</option>
      <option value="Electronics">Electronics</option>
      <option value="Mechanical">Mechanical</option>
      <option value="Civil">Civil</option>
      <option value="Information Technology">Information Technology</option>
      <option value="Electrical">Electrical</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Student</th>
          <th>Roll No</th>
          <th>Department</th>
          <th>Year</th>
          <th>CGPA</th>
          <th>Contact</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTable">
        <tr><td colspan="8"><div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="formOverlay" onclick="closeOnBackdrop(event, 'formOverlay')">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">Add Student</span>
      <button class="modal-close" onclick="closeModal('formOverlay')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div class="form-group full">
        <label class="form-label">Full Name *</label>
        <input type="text" class="form-input" id="f_name" placeholder="e.g. Aravind Kumar">
      </div>
      <div class="form-group">
        <label class="form-label">Roll Number *</label>
        <input type="text" class="form-input" id="f_roll" placeholder="e.g. 21CS001">
      </div>
      <div class="form-group">
        <label class="form-label">Year *</label>
        <select class="form-input" id="f_year">
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>
      <div class="form-group full">
        <label class="form-label">Department *</label>
        <select class="form-input" id="f_dept">
          <option value="Computer Science">Computer Science</option>
          <option value="Electronics">Electronics</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Civil">Civil</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Electrical">Electrical</option>
        </select>
      </div>
      <div class="form-group full">
        <label class="form-label">Email *</label>
        <input type="email" class="form-input" id="f_email" placeholder="student@college.edu">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" class="form-input" id="f_phone" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label class="form-label">CGPA</label>
        <input type="number" class="form-input" id="f_cgpa" placeholder="e.g. 8.5" min="0" max="10" step="0.01">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('formOverlay')">Cancel</button>
      <button class="btn btn-primary" onclick="submitForm()">Save Student</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="overlay" id="deleteOverlay" onclick="closeOnBackdrop(event, 'deleteOverlay')">
  <div class="modal confirm-modal">
    <div class="icon">🗑️</div>
    <h3>Delete Student?</h3>
    <p>This will permanently remove <strong id="deleteNameLabel"></strong> from the database. This action cannot be undone.</p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-ghost" onclick="closeModal('deleteOverlay')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script src="script.js"></script>
</body>
</html>
